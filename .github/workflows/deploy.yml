name: Deploy to Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          
      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 167.235.137.52 >> ~/.ssh/known_hosts
          
      - name: Create deployment package
        run: |
          tar --exclude="node_modules" \
              --exclude=".git" \
              --exclude=".github" \
              --exclude="*.tar.gz" \
              --exclude="backups" \
              -czf deployment.tar.gz .
              
      - name: Upload to server
        run: |
          scp deployment.tar.gz root@167.235.137.52:/tmp/
          
      - name: Deploy on server
        run: |
          ssh root@167.235.137.52 << 'EOF'
            cd /var/www/greenroasteries
            
            # Stop the application
            pm2 stop greenroasteries || true
            
            # Backup current version
            if [ -d "backup-$(date +%Y%m%d)" ]; then
              rm -rf "backup-$(date +%Y%m%d)"
            fi
            mkdir -p "backup-$(date +%Y%m%d)"
            cp -r app lib prisma package*.json next.config.js "backup-$(date +%Y%m%d)/" 2>/dev/null || true
            
            # Extract new version
            tar -xzf /tmp/deployment.tar.gz
            
            # Install/update dependencies
            npm install --production
            
            # Ensure .env is properly configured
            if [ ! -f .env ]; then
              echo "Creating .env file..."
            cat > .env << 'ENVFILE'
DATABASE_URL=postgresql://greenroasteries:your_password@localhost:5432/greenroasteries
            JWT_SECRET=8Vgq2eXQ4XYwfvXf19GKrOdnw22Y69P71A9ceb6e24k=
            NODE_ENV=production
            NEXT_TELEMETRY_DISABLED=1
CLOUDINARY_CLOUD_NAME=your_cloudinary_name
CLOUDINARY_API_KEY=your_cloudinary_key
CLOUDINARY_API_SECRET=your_cloudinary_secret
NEXT_PUBLIC_SITE_URL=https://thegreenroasteries.com
STRIPE_PUBLIC_KEY=your_stripe_public_key
STRIPE_SECRET_KEY=your_stripe_secret_key
STRIPE_WEBHOOK_SECRET=your_stripe_webhook_secret
TABBY_PUBLIC_KEY=pk_test_0197c11f-299d-d003-8b0c-5fe3dd87682c
TABBY_SECRET_KEY=sk_test_0197c11f-299d-d003-8b0c-5fe496e87300
TABBY_MERCHANT_CODE=GR
TABBY_WEBHOOK_ID=3d82921e-0e94-4815-b91e-dc201ee3f043
TABBY_WEBHOOK_SECRET=your_webhook_secret_here
TABBY_AUTO_CAPTURE=true
NEXT_PUBLIC_TABBY_PUBLIC_KEY=pk_test_0197c11f-299d-d003-8b0c-5fe3dd87682c
            ENVFILE
            fi
            
            # ✅ CRITICAL: Verify .next directory is complete
            if [ ! -f .next/BUILD_ID ] || [ ! -d .next/server ] || [ ! -f .next/prerender-manifest.json ]; then
              echo "❌ ERROR: Incomplete .next build detected!"
              echo "Missing files:"
              [ ! -f .next/BUILD_ID ] && echo "  - .next/BUILD_ID"
              [ ! -d .next/server ] && echo "  - .next/server directory" 
              [ ! -f .next/prerender-manifest.json ] && echo "  - .next/prerender-manifest.json"
              exit 1
            fi
            
            echo "✅ Build verification successful - all required files present"
            
            # Start the application
            pm2 start ecosystem.config.js || pm2 start npm --name "greenroasteries" -- start
            
            # Verify deployment success
            sleep 5
            if pm2 show greenroasteries | grep -q "online"; then
              echo "🎉 Deployment successful!"
            else
              echo "❌ Deployment failed - rolling back"
              pm2 stop greenroasteries || true
              if [ -d "backup-$(date +%Y%m%d)" ]; then
                cp -r "backup-$(date +%Y%m%d)"/* .
                pm2 start ecosystem.config.js
              fi
              exit 1
            fi
            
            # Clean up
            rm -f /tmp/deployment.tar.gz
            
            # Show final status
            echo "📊 Final Status:"
            pm2 status
            curl -I https://thegreenroasteries.com || echo "Website check failed"
          EOF 